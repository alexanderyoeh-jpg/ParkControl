# ==============================================================================
# Configuración Nginx para ParkControl (neatspace.cl)
# ==============================================================================

# 1. API BACKEND (api.neatspace.cl)
server {
    listen 80;
    listen [::]:80;
    server_name api.neatspace.cl;

    client_max_body_size 10M;

    location /downloads/ {
        alias /var/www/parkcontrol/deploy/web_dist/downloads/;
        autoindex off;
        add_header Content-Disposition "attachment";
    }

    location / {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_upgrade;
        proxy_read_timeout 60s;
    }
}

# 2. WEB APP FLUTTER (app.neatspace.cl, neatspace.cl, www.neatspace.cl)
server {
    listen 80;
    listen [::]:80;
    server_name app.neatspace.cl neatspace.cl www.neatspace.cl;

    root /var/www/parkcontrol/deploy/web_dist;
    index index.html;

    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml application/xml+rss text/javascript image/svg+xml;

    location /downloads/ {
        alias /var/www/parkcontrol/deploy/web_dist/downloads/;
        autoindex off;
        add_header Content-Disposition "attachment";
    }

    location / {
        try_files $uri $uri/ /index.html;
    }

    # Archivos HTML y scripts principales: Cero caché para actualización inmediata
    location ~* (index\.html|flutter_bootstrap\.js|flutter_service_worker\.js|main\.dart\.js)$ {
        expires -1;
        add_header Cache-Control "no-store, no-cache, must-revalidate, proxy-revalidate, max-age=0";
    }

    location ~* \.(?:ico|css|gif|jpe?g|png|woff2?|eot|ttf|svg|wasm)$ {
        expires 7d;
        add_header Cache-Control "public, max-age=604800";
    }
}
