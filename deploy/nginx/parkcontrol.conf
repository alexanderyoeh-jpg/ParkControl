# ==============================================================================
# Configuración Nginx para ParkControl (neatsapce.cl)
# ==============================================================================

# 1. API BACKEND (api.neatsapce.cl)
server {
    listen 80;
    listen [::]:80;
    server_name api.neatsapce.cl;

    client_max_body_size 10M;

    location / {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_upgrade;
        proxy_read_timeout 60s;
    }
}

# 2. WEB APP FLUTTER (app.neatsapce.cl, neatsapce.cl, www.neatsapce.cl)
server {
    listen 80;
    listen [::]:80;
    server_name app.neatsapce.cl neatsapce.cl www.neatsapce.cl;

    root /var/www/parkcontrol/deploy/web_dist;
    index index.html;

    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml application/xml+rss text/javascript image/svg+xml;

    location / {
        try_files $uri $uri/ /index.html;
    }

    location ~* \.(?:ico|css|js|gif|jpe?g|png|woff2?|eot|ttf|svg|wasm)$ {
        expires 30d;
        add_header Cache-Control "public, max-age=2592000, immutable";
    }
}
