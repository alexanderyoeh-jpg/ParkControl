# ==============================================================================
# Configuración Nginx de Producción para ParkControl (neatsapce.cl)
# ==============================================================================

# Redirección HTTP -> HTTPS
server {
    listen 80;
    listen [::]:80;
    server_name neatsapce.cl www.neatsapce.cl api.neatsapce.cl app.neatsapce.cl;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

# 1. API BACKEND (api.neatsapce.cl)
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name api.neatsapce.cl;

    ssl_certificate /etc/letsencrypt/live/api.neatsapce.cl/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/api.neatsapce.cl/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;

    # Seguridad HTTP Headers
    add_header X-Frame-Options "DENY" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

    # Tamaño máximo de subida para comprobantes y reportes
    client_max_body_size 10M;

    location / {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_upgrade;
        proxy_read_timeout 60s;
    }
}

# 2. WEB APP FLUTTER (app.neatsapce.cl y neatsapce.cl)
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name app.neatsapce.cl neatsapce.cl www.neatsapce.cl;

    ssl_certificate /etc/letsencrypt/live/app.neatsapce.cl/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/app.neatsapce.cl/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;

    root /var/www/parkcontrol/frontend/build/web;
    index index.html;

    # Compresión gzip para assets web
    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml application/xml+rss text/javascript image/svg+xml;

    location / {
        try_files $uri $uri/ /index.html;
    }

    # Caché de assets estáticos Flutter (CanvasKit, fuentes, imágenes)
    location ~* \.(?:ico|css|js|gif|jpe?g|png|woff2?|eot|ttf|svg|wasm)$ {
        expires 30d;
        add_header Cache-Control "public, max-age=2592000, immutable";
    }
}
